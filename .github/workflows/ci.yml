name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Analysis dependencies
        run: python -m pip install pandas scipy statsmodels openpyxl matplotlib python-pptx
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Skill lint
        run: python tools/lint_skills.py
